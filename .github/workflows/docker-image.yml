# 构建并发布 WebTerm 容器镜像到 GitHub Container Registry（GHCR）。
#
# 为什么需要一个 workflow（而不是本地 docker build）：
#   * 让镜像的产出**可复现**：任何人看 commit 就知道镜像是哪份代码构建的；
#   * 让验收条件「docker run -p 8080:8080 webterm 可访问」**在 CI 里被真的跑一遍**，
#     而不是只写一句「本地构建成功」。
#
# 四个刻意的取舍：
#
# * **push 才登录/推送，PR 只构建**。fork 过来的 PR 拿不到 packages:write，
#   也不该往仓库的 registry 里写东西；但 PR 仍要构建，否则 Dockerfile 改坏了要等合并后才发现。
# * **常规构建只做 amd64，发布标签（v*）与手动触发才做 amd64+arm64**。
#   arm64 要走 QEMU 模拟，而这个项目里有 better-sqlite3、rolldown、oxide 等原生模块，
#   模拟下构建会慢好几倍。每次提交都付这份时间不值得，发布时才值得。
# * **关掉 provenance 证明**。buildx 默认会附带 attestation，结果是仓库里多出
#   一个 `unknown/unknown` 平台条目，很多工具（含 Portainer、部分 k8s）会看得一脸问号。
#   这个项目不需要它，关掉换一个干净的 manifest。
# * **push: false 时不加 tag 前缀**。PR 的标签是 `pr-<n>`，只用于本地 buildx 标记，
#   不会进入 registry。

name: Docker Image CI

on:
  push:
    branches: ['main']
    tags: ['v*']
    # 文档与测试脚手架的改动不影响镜像内容，不必为它们跑一遍构建。
    # 注意 data/tmp 之外的 data/ 不能忽略：data/plugins 是要打进镜像的示例插件。
    # （路径过滤对 tag 推送不生效，见 GitHub 文档 —— 所以打 v* 标签一定会构建。）
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'data/tmp/**'
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      platforms:
        description: '目标平台（逗号分隔）'
        type: string
        default: 'linux/amd64,linux/arm64'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: 构建并推送
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      ref: ${{ steps.name.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      # 镜像名必须是全小写：GHCR 会校验仓库名，而 github.repository 保留账号原始大小写。
      - name: 计算镜像名与引用
        id: name
        run: |
          image="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "本次镜像：${image}"

      - name: 决定目标平台
        id: platforms
        env:
          REQUESTED: ${{ inputs.platforms }}
        run: |
          if [ -n "${REQUESTED}" ]; then
            echo "value=${REQUESTED}" >> "$GITHUB_OUTPUT"
            echo "手动指定平台：${REQUESTED}"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "发布标签：构建 amd64 + arm64"
            exit 0
          fi
          echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
          echo "常规构建：只做 amd64（要 arm64 请打 v* 标签或手动触发）"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha 标签用 format=long：冒烟作业在另一个 job 里，需要一个**能算出来**的标签名，
      # 而不是把 metadata 的输出跨 job 传过去。
      # 标签里带的 org.opencontainers.image.source 会让 GHCR 把这个包自动关联到本仓库，
      # 否则包在 Packages 列表里是个「无主」条目，也没法用同仓库的 GITHUB_TOKEN 拉取。
      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 汇总
        if: always()
        run: |
          {
            echo '## 构建结果'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo "| 平台 | \`${{ steps.platforms.outputs.value }}\` |"
            echo '| 标签 |'
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/| `/; s/$/` |/'
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # 把「镜像能跑」变成 CI 里的证据，而不是一句声明。
  # 这一条正对着阶段 9 的验收条件：docker run -p 8080:8080 webterm 可访问。
  smoke:
    name: 跑起来验一遍
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 包首次推送是私有的，所以这里必须带 token 拉；要让外部匿名 pull，
      # 需要去 Package settings 把可见性改成 Public（见 README「生产部署」）。
      - name: 拉取刚推上去的镜像
        run: docker pull "${IMAGE}"

      - name: 启动容器
        run: docker run -d --name webterm -p 8080:8080 "${IMAGE}"

      - name: 等它活过来
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health -o /tmp/health.json; then
              echo "第 ${i} 次探活成功"
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/health.json ]; then
            echo "::error::容器 80 秒内没有通过健康检查"
            exit 1
          fi
          cat /tmp/health.json
          echo

      - name: 断言：健康接口、首页是 HTML、版本与仓库一致
        run: |
          set -euo pipefail

          grep -q '"ok":true' /tmp/health.json

          ct=$(curl -fsSI http://127.0.0.1:8080/ | tr -d '\r' | grep -i '^content-type:' || true)
          case "${ct}" in
            *text/html*) echo "首页 Content-Type：${ct}" ;;
            *) echo "::error::首页不是 HTML（静态资源没打进镜像？）：${ct:-<空>}"; exit 1 ;;
          esac

          curl -fsS http://127.0.0.1:8080/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html

          want=$(node -p "require('./package.json').version")
          got=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')).version")
          echo "package.json=${want}  容器内=${got}"
          [ "${want}" = "${got}" ] || { echo "::error::镜像里的版本与仓库不一致"; exit 1; }

      - name: 诊断信息（失败时）
        if: failure()
        run: |
          echo '--- docker ps -a ---'; docker ps -a
          echo '--- docker logs ---'; docker logs --tail 200 webterm 2>&1 || true
          echo '--- docker inspect ---'; docker inspect webterm --format '{{json .State}}' || true

      - name: 汇总
        if: always()
        run: |
          {
            echo '## 冒烟结果'
            echo ''
            echo '```'
            echo "docker run -p 8080:8080 ${IMAGE}"
            echo "GET /api/health  ->  $(cat /tmp/health.json 2>/dev/null || echo '<无响应>')"
            echo '```'
            echo ''
            echo "拉取： \`docker pull ${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
